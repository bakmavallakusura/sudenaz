<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudenaz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #090312;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
        }

        /* Kalbin Altındaki İmza - Sudenaz */
        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 4.2rem;
            color: #e0aaff;
            text-shadow: 0 0 15px #c77dff, 0 0 30px #9d4edd, 0 0 50px #7b2cbf;
            opacity: 0;
            transform: translateY(20px);
            transition: all 2s ease-in-out;
            letter-spacing: 2px;
            margin-top: 180px; /* Kalbin hemen altına denk gelmesi için */
        }

        .signature.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Tıklama Uyarısı */
        .click-hint {
            position: absolute;
            bottom: 8%;
            z-index: 3;
            font-size: 0.9rem;
            color: #c77dff;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="canvas"></canvas>
    <div class="ui-layer">
        <div class="signature" id="sigText">Sudenaz</div>
    </div>
    <div class="click-hint" id="hint">Dokun ve Başlat ✨</div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const sigText = document.getElementById('sigText');
    const hint = document.getElementById('hint');

    let width, height;
    let isRunning = false;
    let animFrame;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Kalp Parametrik Denklemi
    function getHeartPoint(t) {
        const scale = Math.min(width, height) / 42;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return {
            x: width / 2 + x * scale,
            y: height / 2 - 40 + y * scale // Kalbi biraz daha yukarı konumlandırdık
        };
    }

    function startAnimation() {
        if (isRunning) return;
        isRunning = true;

        hint.style.display = 'none';
        sigText.classList.remove('show');

        let phi = (1 + Math.sqrt(5)) / 2; // Altın Oran
        let angle = 0;
        let t = 0;
        let phase = 'golden-spiral';

        ctx.clearRect(0, 0, width, height);

        function render() {
            ctx.fillStyle = 'rgba(9, 3, 18, 0.12)';
            ctx.fillRect(0, 0, width, height);

            if (phase === 'golden-spiral') {
                // Altın oran spirali çizimi
                angle += 0.08;
                const radius = Math.pow(phi, angle / (Math.PI * 1.5)) * 2;
                
                const cx = width / 2;
                const cy = height / 2 - 40;

                const x1 = cx + radius * Math.cos(angle);
                const y1 = cy + radius * Math.sin(angle);
                const x2 = cx - radius * Math.cos(angle);
                const y2 = cy - radius * Math.sin(angle);

                ctx.strokeStyle = 'rgba(199, 125, 255, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#c77dff';

                ctx.beginPath();
                ctx.arc(x1, y1, 1.5, 0, Math.PI * 2);
                ctx.arc(x2, y2, 1.5, 0, Math.PI * 2);
                ctx.stroke();

                if (radius > Math.min(width, height) / 2.8) {
                    phase = 'heart';
                    ctx.beginPath();
                    const p = getHeartPoint(0);
                    ctx.moveTo(p.x, p.y);
                }
            } else if (phase === 'heart') {
                // Kalp çizgisi
                t += 0.035;

                ctx.strokeStyle = '#e0aaff';
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#c77dff';

                if (t <= Math.PI * 2) {
                    const p = getHeartPoint(t);
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();
                } else {
                    const p = getHeartPoint(Math.PI * 2);
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();

                    phase = 'end';
                    setTimeout(() => {
                        sigText.classList.add('show');
                    }, 400);
                }
            }

            if (phase !== 'end') {
                animFrame = requestAnimationFrame(render);
            }
        }

        render();
    }

    window.addEventListener('click', () => {
        isRunning = false;
        cancelAnimationFrame(animFrame);
        startAnimation();
    });

    window.addEventListener('touchstart', () => {
        isRunning = false;
        cancelAnimationFrame(animFrame);
        startAnimation();
    });
</script>

</body>
</html>
