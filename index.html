<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudenaz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #04010a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
        }

        /* Kalbin Altındaki İmza - El Yazısı Alanı */
        .signature-container {
            margin-top: 200px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #d8b4fe;
            text-shadow: 0 0 15px #9d4edd, 0 0 30px #7b2cbf, 0 0 45px #3c096c;
            letter-spacing: 3px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid transparent;
            width: 0;
        }

        .signature.writing {
            border-color: #c77dff;
            animation: blink-cursor 0.7s infinite;
        }

        .signature.finished {
            border-color: transparent;
            animation: none;
        }

        @keyframes blink-cursor {
            50% { border-color: transparent; }
        }

        /* Tıklama Uyarısı */
        .click-hint {
            position: absolute;
            bottom: 8%;
            z-index: 3;
            font-size: 0.85rem;
            color: #9d4edd;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.05); }
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="canvas"></canvas>
    <div class="ui-layer">
        <div class="signature-container">
            <div class="signature" id="sigText"></div>
        </div>
    </div>
    <div class="click-hint" id="hint">Dokun ve Başlat ✨</div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const sigText = document.getElementById('sigText');
    const hint = document.getElementById('hint');

    let width, height;
    let isRunning = false;
    let animFrame;

    // Mor Yağmur Damlaları
    const rainDrops = [];
    const rainCount = 70;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Arka plan Yağmuru
    for (let i = 0; i < rainCount; i++) {
        rainDrops.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            length: Math.random() * 20 + 10,
            speed: Math.random() * 3 + 1.5,
            opacity: Math.random() * 0.4 + 0.1
        });
    }

    function drawRain() {
        ctx.lineWidth = 1;
        for (let i = 0; i < rainCount; i++) {
            const drop = rainDrops[i];
            ctx.strokeStyle = `rgba(157, 78, 221, ${drop.opacity})`;
            ctx.beginPath();
            ctx.moveTo(drop.x, drop.y);
            ctx.lineTo(drop.x, drop.y + drop.length);
            ctx.stroke();

            drop.y += drop.speed;
            if (drop.y > height) {
                drop.y = -drop.length;
                drop.x = Math.random() * width;
            }
        }
    }

    // Kalp Denklem Koordinatları
    function getHeartPoint(t) {
        const scale = Math.min(width, height) / 42;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return {
            x: width / 2 + x * scale,
            y: height / 2 - 40 + y * scale
        };
    }

    // Altın Oran Spirali Çizen Fonksiyon (Her Kalp Noktasında Dönen Spiral)
    function drawGoldenSpiralAt(cx, cy, radius, rotAngle) {
        const phi = (1 + Math.sqrt(5)) / 2;
        ctx.strokeStyle = 'rgba(216, 180, 254, 0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();

        for (let a = 0; a < Math.PI * 3; a += 0.1) {
            const r = Math.pow(phi, a / (Math.PI / 2)) * (radius / 15);
            if (r > radius) break;
            const x = cx + r * Math.cos(a + rotAngle);
            const y = cy + r * Math.sin(a + rotAngle);
            if (a === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    // Harf Harf El Yazısı
    function typeSignature(text, index = 0) {
        if (index === 0) {
            sigText.textContent = '';
            sigText.style.width = 'auto';
            sigText.classList.add('writing');
        }

        if (index < text.length) {
            sigText.textContent += text.charAt(index);
            setTimeout(() => {
                typeSignature(text, index + 1);
            }, 200);
        } else {
            setTimeout(() => {
                sigText.classList.remove('writing');
                sigText.classList.add('finished');
            }, 800);
        }
    }

    function startAnimation() {
        if (isRunning) return;
        isRunning = true;

        hint.style.display = 'none';
        sigText.textContent = '';

        let t = 0;
        let spiralAngle = 0;
        let isFinished = false;

        function render() {
            ctx.fillStyle = '#04010a';
            ctx.fillRect(0, 0, width, height);
            drawRain();

            // Kalp çizimi ilerliyor
            if (!isFinished) {
                t += 0.025;
                spiralAngle += 0.15;

                if (t >= Math.PI * 2) {
                    t = Math.PI * 2;
                    isFinished = true;
                    setTimeout(() => {
                        typeSignature('Sudenaz');
                    }, 400);
                }
            }

            // Kalp çizgisini ve Altın Oran spirallerini oluştur
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#c77dff';

            ctx.beginPath();
            ctx.strokeStyle = '#e0aaff';
            ctx.lineWidth = 2.5;

            for (let currentT = 0; currentT <= t; currentT += 0.025) {
                const p = getHeartPoint(currentT);

                if (currentT === 0) {
                    ctx.moveTo(p.x, p.y);
                } else {
                    ctx.lineTo(p.x, p.y);
                }

                // Kalbin üzerindeki belli aralıklara Altın Oran Spirali Kondur
                if (Math.abs(currentT - t) < 0.05) {
                    drawGoldenSpiralAt(p.x, p.y, 25, spiralAngle);
                }
            }
            ctx.stroke();

            animFrame = requestAnimationFrame(render);
        }

        render();
    }

    function idleRain() {
        if (!isRunning) {
            ctx.fillStyle = '#04010a';
            ctx.fillRect(0, 0, width, height);
            drawRain();
            requestAnimationFrame(idleRain);
        }
    }
    idleRain();

    window.addEventListener('click', () => {
        if(!isRunning) startAnimation();
    });

    window.addEventListener('touchstart', () => {
        if(!isRunning) startAnimation();
    });
</script>

</body>
</html>
