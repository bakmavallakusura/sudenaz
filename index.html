<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudenaz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Fira+Code:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #090312;
            color: #fff;
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
        }

        /* Başlık - Sudenaz */
        .title {
            font-size: 3.5rem;
            letter-spacing: 6px;
            color: #e0aaff;
            text-shadow: 0 0 15px #c77dff, 0 0 30px #9d4edd, 0 0 50px #7b2cbf;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 2s ease-in-out;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .title.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Ortadaki Matematiksel Denklem */
        .equation {
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            color: #d8b4fe;
            background: rgba(15, 5, 29, 0.65);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(199, 125, 255, 0.3);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.2);
            backdrop-filter: blur(5px);
            opacity: 0;
            transform: scale(0.8);
            transition: all 1.5s ease-in-out;
            letter-spacing: 1px;
        }

        .equation.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Tıklama Uyarısı */
        .click-hint {
            position: absolute;
            bottom: 8%;
            z-index: 3;
            font-size: 0.95rem;
            color: #c77dff;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="canvas"></canvas>
    <div class="ui-layer">
        <div class="title" id="titleText">SUDENAZ</div>
        <div class="equation" id="eqText">(x² + y² - 1)³ - x²y³ = 0</div>
    </div>
    <div class="click-hint" id="hint">Dokun ve Başlat ✨</div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const titleText = document.getElementById('titleText');
    const eqText = document.getElementById('eqText');
    const hint = document.getElementById('hint');

    let width, height;
    let isRunning = false;
    let animFrame;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Kalp Parametrik Denklemi
    function getHeartPoint(t) {
        const scale = Math.min(width, height) / 42;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return {
            x: width / 2 + x * scale,
            y: height / 2 + y * scale
        };
    }

    // Altın Oran Spirali Çizimi
    function drawGoldenSpiral(progress) {
        const phi = (1 + Math.sqrt(5)) / 2;
        const cx = width / 2;
        const cy = height / 2;

        ctx.save();
        ctx.strokeStyle = 'rgba(199, 125, 255, 0.25)';
        ctx.lineWidth = 1;

        for (let j = 0; j < 2; j++) { // İki yöne simetrik spiral
            ctx.beginPath();
            const maxAngle = progress * Math.PI * 6;
            const dir = j === 0 ? 1 : -1;

            for (let a = 0; a < maxAngle; a += 0.05) {
                const r = Math.pow(phi, a / (Math.PI / 2)) * 3;
                if (r > Math.max(width, height) / 2) break;
                const x = cx + dir * r * Math.cos(a + (j * Math.PI));
                const y = cy + r * Math.sin(a);
                if (a === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        ctx.restore();
    }

    function startAnimation() {
        if (isRunning) return;
        isRunning = true;

        hint.style.display = 'none';
        titleText.classList.remove('show');
        eqText.classList.remove('show');

        let phase = 'spirals'; // 1. Spiraller, 2. Kalp, 3. Yazılar
        let spiralProgress = 0;
        let t = 0;

        ctx.clearRect(0, 0, width, height);

        function render() {
            ctx.fillStyle = 'rgba(9, 3, 18, 0.15)'; // Akıcı iz efekti
            ctx.fillRect(0, 0, width, height);

            if (phase === 'spirals') {
                spiralProgress += 0.02;
                drawGoldenSpiral(spiralProgress);

                if (spiralProgress >= 1) {
                    phase = 'heart';
                    ctx.beginPath();
                    const p = getHeartPoint(0);
                    ctx.moveTo(p.x, p.y);
                }
            } else if (phase === 'heart') {
                t += 0.035;

                ctx.strokeStyle = '#e0aaff';
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#c77dff';

                if (t <= Math.PI * 2) {
                    const p = getHeartPoint(t);
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();
                } else {
                    const p = getHeartPoint(Math.PI * 2);
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();

                    // Tamamlandı
                    phase = 'end';
                    setTimeout(() => {
                        eqText.classList.add('show');
                        titleText.classList.add('show');
                    }, 400);
                }
            }

            if (phase !== 'end') {
                animFrame = requestAnimationFrame(render);
            }
        }

        render();
    }

    window.addEventListener('click', () => {
        isRunning = false;
        cancelAnimationFrame(animFrame);
        startAnimation();
    });

    window.addEventListener('touchstart', () => {
        isRunning = false;
        cancelAnimationFrame(animFrame);
        startAnimation();
    });
</script>

</body>
</html>
