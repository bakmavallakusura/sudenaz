<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudenaz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Çok daha koyu, derin gece moru arka plan */
            background: #04010a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
        }

        /* Kalbin Altındaki İmza - Sudenaz */
        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #d8b4fe;
            text-shadow: 0 0 15px #9d4edd, 0 0 30px #7b2cbf, 0 0 45px #3c096c;
            opacity: 0;
            transform: translateY(20px);
            transition: all 2s ease-in-out;
            letter-spacing: 2px;
            margin-top: 190px;
        }

        .signature.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Tıklama Uyarısı */
        .click-hint {
            position: absolute;
            bottom: 8%;
            z-index: 3;
            font-size: 0.85rem;
            color: #9d4edd;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.05); }
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="canvas"></canvas>
    <div class="ui-layer">
        <div class="signature" id="sigText">Sudenaz</div>
    </div>
    <div class="click-hint" id="hint">Dokun ve Başlat ✨</div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const sigText = document.getElementById('sigText');
    const hint = document.getElementById('hint');

    let width, height;
    let isRunning = false;
    let animFrame;

    // Mor Yağmur Damlaları Dizisi
    const rainDrops = [];
    const rainCount = 70;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Yağmur Parçacıklarını Başlat
    for (let i = 0; i < rainCount; i++) {
        rainDrops.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            length: Math.random() * 20 + 10,
            speed: Math.random() * 3 + 1.5,
            opacity: Math.random() * 0.4 + 0.1
        });
    }

    function drawRain() {
        ctx.lineWidth = 1;
        for (let i = 0; i < rainCount; i++) {
            const drop = rainDrops[i];
            ctx.strokeStyle = `rgba(157, 78, 221, ${drop.opacity})`;
            ctx.beginPath();
            ctx.moveTo(drop.x, drop.y);
            ctx.lineTo(drop.x, drop.y + drop.length);
            ctx.stroke();

            drop.y += drop.speed;
            if (drop.y > height) {
                drop.y = -drop.length;
                drop.x = Math.random() * width;
            }
        }
    }

    // Kalp Parametrik Denklemi
    function getHeartPoint(t) {
        const scale = Math.min(width, height) / 42;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return {
            x: width / 2 + x * scale,
            y: height / 2 - 40 + y * scale
        };
    }

    function startAnimation() {
        if (isRunning) return;
        isRunning = true;

        hint.style.display = 'none';
        sigText.classList.remove('show');

        let phi = (1 + Math.sqrt(5)) / 2; // Altın Oran
        let angle = 0;
        let t = 0;
        let phase = 'golden-spiral';

        function render() {
            // Koyu arka planı temizle ve yağmuru çiz
            ctx.fillStyle = '#04010a';
            ctx.fillRect(0, 0, width, height);
            drawRain();

            if (phase === 'golden-spiral') {
                angle += 0.08;
                const radius = Math.pow(phi, angle / (Math.PI * 1.5)) * 2;
                
                const cx = width / 2;
                const cy = height / 2 - 40;

                const x1 = cx + radius * Math.cos(angle);
                const y1 = cy + radius * Math.sin(angle);
                const x2 = cx - radius * Math.cos(angle);
                const y2 = cy - radius * Math.sin(angle);

                ctx.strokeStyle = 'rgba(199, 125, 255, 0.5)';
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#9d4edd';

                ctx.beginPath();
                ctx.arc(x1, y1, 1.5, 0, Math.PI * 2);
                ctx.arc(x2, y2, 1.5, 0, Math.PI * 2);
                ctx.stroke();

                if (radius > Math.min(width, height) / 2.8) {
                    phase = 'heart';
                }
            } else if (phase === 'heart' || phase === 'end') {
                // Kalbi çiz/koru
                if (phase === 'heart') {
                    t += 0.035;
                    if (t >= Math.PI * 2) {
                        t = Math.PI * 2;
                        phase = 'end';
                        setTimeout(() => {
                            sigText.classList.add('show');
                        }, 300);
                    }
                }

                ctx.strokeStyle = '#e0aaff';
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#c77dff';

                ctx.beginPath();
                for (let currentT = 0; currentT <= t; currentT += 0.035) {
                    const p = getHeartPoint(currentT);
                    if (currentT === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }

            animFrame = requestAnimationFrame(render);
        }

        render();
    }

    // Sayfa açıldığında sadece yağmur aksın
    function idleRain() {
        if (!isRunning) {
            ctx.fillStyle = '#04010a';
            ctx.fillRect(0, 0, width, height);
            drawRain();
            requestAnimationFrame(idleRain);
        }
    }
    idleRain();

    window.addEventListener('click', () => {
        if(!isRunning) startAnimation();
    });

    window.addEventListener('touchstart', () => {
        if(!isRunning) startAnimation();
    });
</script>

</body>
</html>
